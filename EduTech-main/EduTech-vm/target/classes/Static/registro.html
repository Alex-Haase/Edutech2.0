<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registro | YSE Educación Digital</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    :root {
      --primary: #2C3E50;
      --secondary: #E74C3C;
      --accent: #3498DB;
      --light: #ECF0F1;
      --dark: #1A252F;
    }
    body {
      background: linear-gradient(rgba(44, 62, 80, 0.85), rgba(44, 62, 80, 0.85)), 
                  url('https://images.unsplash.com/photo-1523240795612-9a054b0db644?ixlib=rb-4.0.3&auto=format&fit=crop&w=1350&q=80');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: fadeIn 0.8s ease-in-out;
      margin: 0;
      padding: 20px;
    }
    .register-container {
      max-width: 450px;
      width: 100%;
      padding: 2.5rem;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 1rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255,255,255,0.2);
    }
    .logo {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      color: var(--primary);
      text-align: center;
    }
    .logo span {
      color: var(--accent);
    }
    .btn-success {
      background-color: var(--secondary);
      border: none;
      padding: 12px;
      font-weight: 600;
      transition: all 0.3s;
      margin-top: 1rem;
    }
    .btn-success:hover {
      background-color: #C0392B;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(231, 76, 60, 0.3);
    }
    .form-control {
      padding: 12px 15px;
      margin-bottom: 1.2rem;
      border: 1px solid #ddd;
      transition: all 0.3s;
    }
    .form-control:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 0.25rem rgba(52, 152, 219, 0.25);
    }
    .footer-links {
      margin-top: 1.5rem;
      text-align: center;
    }
    .footer-links a {
      color: var(--primary);
      text-decoration: none;
      transition: color 0.3s;
    }
    .footer-links a:hover {
      color: var(--accent);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .input-group-text {
      background-color: var(--light);
      border-right: none;
      color: var(--primary);
    }
    .input-group input {
      border-left: none;
    }
    .password-strength {
      height: 5px;
      background: #eee;
      margin-bottom: 15px;
      border-radius: 5px;
      overflow: hidden;
    }
    .password-strength-bar {
      height: 100%;
      width: 0%;
      background: #e74c3c;
      transition: width 0.3s, background 0.3s;
    }
  </style>
</head>
<body>
  <div class="register-container">
    <div class="logo">Y<span>SE</span></div>
    <h2 class="mb-4 text-center">Crear Cuenta</h2>
    
    <div class="input-group mb-3">
      <span class="input-group-text"><i class="fas fa-user"></i></span>
      <input id="nombre" class="form-control" placeholder="Nombre completo" required>
    </div>
    
    <div class="input-group mb-3">
      <span class="input-group-text"><i class="fas fa-envelope"></i></span>
      <input id="email" class="form-control" placeholder="Correo electrónico" type="email" required>
    </div>
    
    <div class="input-group mb-3">
      <span class="input-group-text"><i class="fas fa-lock"></i></span>
      <input id="password" class="form-control" placeholder="Contraseña" type="password" required oninput="checkPasswordStrength(this.value)">
    </div>
    
    <div class="password-strength">
      <div class="password-strength-bar" id="password-strength-bar"></div>
    </div>
    
    <div class="input-group mb-4">
      <span class="input-group-text"><i class="fas fa-lock"></i></span>
      <input id="confirm-password" class="form-control" placeholder="Confirmar contraseña" type="password" required>
    </div>
    
    <div class="form-check mb-4 text-start">
      <input class="form-check-input" type="checkbox" id="terms" required>
      <label class="form-check-label" for="terms">
        Acepto los <a href="terminos.html">Términos y Condiciones</a> y la <a href="privacidad.html">Política de Privacidad</a>
      </label>
    </div>
    
    <button onclick="registrar()" class="btn btn-success w-100">
      <i class="fas fa-user-plus me-2"></i>Registrarse
    </button>
    
    <div class="footer-links">
      <p class="mt-3">¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a></p>
    </div>
  </div>

  <script>
    function checkPasswordStrength(password) {
      const strengthBar = document.getElementById('password-strength-bar');
      let strength = 0;
      
      if (password.length > 0) strength += 20;
      if (password.length >= 8) strength += 20;
      if (/[A-Z]/.test(password)) strength += 20;
      if (/[0-9]/.test(password)) strength += 20;
      if (/[^A-Za-z0-9]/.test(password)) strength += 20;
      
      strengthBar.style.width = strength + '%';
      
      if (strength < 40) {
        strengthBar.style.background = '#e74c3c';
      } else if (strength < 80) {
        strengthBar.style.background = '#f39c12';
      } else {
        strengthBar.style.background = '#2ecc71';
      }
    }
  </script>
  
  <script src="js/app_reg.js"></script>
</body>
</html>
