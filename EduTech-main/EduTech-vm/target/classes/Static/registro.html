<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro | YSE Educación Digital</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    :root {
      --primary: #2C3E50;
      --secondary: #E74C3C;
      --accent: #3498DB;
      --light: #ECF0F1;
      --dark: #1A252F;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--light);
      color: var(--dark);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      background: linear-gradient(rgba(44, 62, 80, 0.8), rgba(44, 62, 80, 0.8)), url('https://images.unsplash.com/photo-1523240795612-9a054b0db644?ixlib=rb-4.0.3&auto=format&fit=crop&w=1350&q=80');
      background-size: cover;
      background-position: center;
      animation: fadeIn 0.8s ease-in-out;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .logo {
      font-size: 2.5rem;
      font-weight: 700;
      color: white;
      text-align: center;
      margin-bottom: 10px;
    }
    
    .logo span {
      color: var(--accent);
    }
    
    .register-container {
      width: 100%;
      max-width: 450px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.2);
      overflow: hidden;
      animation: slideUp 0.6s ease;
    }
    
    @keyframes slideUp {
      from { transform: translateY(50px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    
    .register-header {
      background: linear-gradient(135deg, var(--primary), var(--dark));
      color: white;
      padding: 25px;
      text-align: center;
    }
    
    .register-body {
      padding: 30px;
    }
    
    .form-group {
      margin-bottom: 20px;
      position: relative;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: var(--primary);
    }
    
    .form-control {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #ddd;
      border-radius: 6px;
      font-size: 1rem;
      transition: all 0.3s;
    }
    
    .form-control:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
      outline: none;
    }
    
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .btn-primary {
      background-color: var(--secondary);
      color: white;
    }
    
    .btn-primary:hover {
      background-color: #C0392B;
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    
    .login-link {
      text-align: center;
      margin-top: 20px;
      color: #666;
    }
    
    .login-link a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }
    
    .login-link a:hover {
      text-decoration: underline;
    }
    
    .input-icon {
      position: absolute;
      right: 15px;
      top: 40px;
      color: #aaa;
    }
    
    @media (max-width: 576px) {
      .register-container {
        margin: 20px;
      }
      
      .register-header {
        padding: 20px;
      }
      
      .register-body {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="register-container">
    <div class="register-header">
      <div class="logo">Y<span>SE</span></div>
      <h2>Crear una cuenta</h2>
      <p>Únete a nuestra plataforma educativa</p>
    </div>
    
    <div class="register-body">
      <div class="form-group">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" class="form-control" placeholder="Ingresa tu nombre">
        <i class="fas fa-user input-icon"></i>
      </div>
      
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" class="form-control" placeholder="tucorreo@ejemplo.com">
        <i class="fas fa-envelope input-icon"></i>
      </div>
      
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" class="form-control" placeholder="Crea una contraseña segura">
        <i class="fas fa-lock input-icon"></i>
      </div>
      
      <button onclick="registrar()" class="btn btn-primary">Registrarse</button>
      
      <div class="login-link">
        ¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a>
      </div>
    </div>
  </div>

  <script src="js/app_reg.js"></script>
</body>
</html>
