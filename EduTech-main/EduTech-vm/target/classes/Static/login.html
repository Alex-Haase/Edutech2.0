<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | YSE Educación Digital</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    :root {
      --primary: #2C3E50;
      --secondary: #E74C3C;
      --accent: #3498DB;
      --light: #ECF0F1;
      --dark: #1A252F;
    }
    body {
      background: linear-gradient(rgba(44, 62, 80, 0.85), rgba(44, 62, 80, 0.85)), 
                  url('https://images.unsplash.com/photo-1523240795612-9a054b0db644?ixlib=rb-4.0.3&auto=format&fit=crop&w=1350&q=80');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: fadeIn 0.8s ease-in-out;
      margin: 0;
      padding: 20px;
    }
    .login-container {
      max-width: 400px;
      width: 100%;
      padding: 2.5rem;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 1rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255,255,255,0.2);
    }
    .logo {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      color: var(--primary);
      text-align: center;
    }
    .logo span {
      color: var(--accent);
    }
    .btn-primary {
      background-color: var(--secondary);
      border: none;
      padding: 10px;
      font-weight: 600;
      transition: all 0.3s;
    }
    .btn-primary:hover {
      background-color: #C0392B;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(231, 76, 60, 0.3);
    }
    .form-control {
      padding: 12px 15px;
      margin-bottom: 1.2rem;
      border: 1px solid #ddd;
      transition: all 0.3s;
    }
    .form-control:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 0.25rem rgba(52, 152, 219, 0.25);
    }
    .footer-links {
      margin-top: 1.5rem;
      text-align: center;
    }
    .footer-links a {
      color: var(--primary);
      text-decoration: none;
      transition: color 0.3s;
      display: inline-block;
      margin: 0 10px;
    }
    .footer-links a:hover {
      color: var(--accent);
      transform: translateY(-2px);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .input-group-text {
      background-color: var(--light);
      border-right: none;
      color: var(--primary);
    }
    .input-group input {
      border-left: none;
    }
    .divider {
      display: flex;
      align-items: center;
      margin: 20px 0;
      color: #666;
      font-size: 14px;
    }
    .divider::before, .divider::after {
      content: "";
      flex: 1;
      border-bottom: 1px solid #ddd;
      margin: 0 10px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">Y<span>SE</span></div>
    <h2 class="mb-4 text-center">Iniciar Sesión</h2>
    
    <div class="input-group mb-3">
      <span class="input-group-text"><i class="fas fa-envelope"></i></span>
      <input id="email" class="form-control" placeholder="Correo electrónico" type="email" required>
    </div>
    
    <div class="input-group mb-4">
      <span class="input-group-text"><i class="fas fa-lock"></i></span>
      <input id="password" class="form-control" placeholder="Contraseña" type="password" required>
    </div>
    
    <button onclick="login()" class="btn btn-primary w-100 mb-3 py-2">
      <i class="fas fa-sign-in-alt me-2"></i>Ingresar
    </button>
    
    <div class="divider">o</div>
    
    <button class="btn btn-outline-primary w-100 mb-3">
      <i class="fab fa-google me-2"></i>Continuar con Google
    </button>
    
    <div class="footer-links">
      <a href="registro.html"><i class="fas fa-user-plus me-1"></i>Regístrate</a>
      <a href="recuperar.html"><i class="fas fa-key me-1"></i>Recuperar contraseña</a>
    </div>

    <form id="redirectForm" method="GET" action="index.html" style="display:none;">
      <input type="hidden" name="nombre" id="nombre">
    </form>
  </div>

  <script src="js/app_lo.js"></script>
</body>
</html>
